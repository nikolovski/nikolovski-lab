name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate content (SKILL.md frontmatter, lessons, resources, marketplace)
        run: npm run validate

      - name: Test the MCP server
        run: npm test

      - name: Validate plugin marketplace with Claude Code
        run: npx -y @anthropic-ai/claude-code plugin validate .

      - name: Build site
        run: npm run build -w site
